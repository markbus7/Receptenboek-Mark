# Haalt elke maandagochtend de nieuwste supermarktprijzen op (bron: Checkjebon) en zet ze in js/data/prijzen.js.
# Met "Run workflow" op het tabblad Actions kun je het ook zelf starten.
name: Prijzen bijwerken

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prijzen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prijzen ophalen
        run: node tools/prijzen-ophalen.js
      - name: Opslaan als er iets veranderd is
        run: |
          if git diff --quiet js/data/prijzen.js; then
            echo "Geen nieuwe prijzen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add js/data/prijzen.js
          git commit -m "Prijzen bijgewerkt ($(date +%Y-%m-%d))"
          git push
